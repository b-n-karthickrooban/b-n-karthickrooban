<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 90" width="400" height="90" preserveAspectRatio="xMidYMid meet" role="img" aria-label="LINKEDIN">
<defs>
<linearGradient id="bl1-bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#16294A"/><stop offset="50%" stop-color="#101E36"/><stop offset="100%" stop-color="#0A1220"/>
</linearGradient>
<radialGradient id="bl1-halo" cx="50%" cy="45%" r="68%">
  <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.40"/>
  <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.16"/>
  <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bl1-cy" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#3B82F6"/><stop offset="55%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#7DD3FC"/>
</linearGradient>
<linearGradient id="bl1-steel" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#1B2636"/><stop offset="45%" stop-color="#46586F"/>
  <stop offset="60%" stop-color="#8A9AAE"/><stop offset="100%" stop-color="#22303F"/>
</linearGradient>
<linearGradient id="bl1-glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.10"/>
  <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.02"/>
</linearGradient>
<linearGradient id="bl1-scan" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
  <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.30"/>
  <stop offset="55%" stop-color="#E0FBFF" stop-opacity="0.38"/>
  <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
</linearGradient>
<filter id="bl1-glow" x="-70%" y="-70%" width="240%" height="240%">
  <feGaussianBlur stdDeviation="3.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bl1-glowS" x="-90%" y="-90%" width="280%" height="280%">
  <feGaussianBlur stdDeviation="1.6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bl1-soft" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="9"/>
</filter>
</defs>
<rect width="400" height="90" fill="#0C1B30"/>
<g opacity="0.2">
<line x1="0" y1="-32.0" x2="400" y2="-32.0" stroke="#3B82F6" stroke-opacity="0.10" stroke-width="0.6"/>
<line x1="0" y1="14.0" x2="400" y2="14.0" stroke="#3B82F6" stroke-opacity="0.10" stroke-width="0.6"/>
<line x1="0" y1="60.0" x2="400" y2="60.0" stroke="#3B82F6" stroke-opacity="0.10" stroke-width="0.6"/>
<line x1="0" y1="0" x2="0" y2="90" stroke="#3B82F6" stroke-opacity="0.055" stroke-width="0.6"/>
<line x1="60" y1="0" x2="60" y2="90" stroke="#3B82F6" stroke-opacity="0.055" stroke-width="0.6"/>
<line x1="120" y1="0" x2="120" y2="90" stroke="#3B82F6" stroke-opacity="0.055" stroke-width="0.6"/>
<line x1="180" y1="0" x2="180" y2="90" stroke="#3B82F6" stroke-opacity="0.055" stroke-width="0.6"/>
<line x1="240" y1="0" x2="240" y2="90" stroke="#3B82F6" stroke-opacity="0.055" stroke-width="0.6"/>
<line x1="300" y1="0" x2="300" y2="90" stroke="#3B82F6" stroke-opacity="0.055" stroke-width="0.6"/>
<line x1="360" y1="0" x2="360" y2="90" stroke="#3B82F6" stroke-opacity="0.055" stroke-width="0.6"/>
</g>
<linearGradient id="bl1-sw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <rect x="-160" y="0" width="160" height="90" fill="url(#bl1-sw)">
      <animate attributeName="x" from="-160" to="400" dur="5s" repeatCount="indefinite"/></rect>
<circle cx="130.0" cy="45.0" r="3.4" fill="#22D3EE" filter="url(#bl1-glowS)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.6;4.2;2.6" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="150.0" y="43.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" letter-spacing="2">LINKEDIN</text>
    <text x="150.0" y="63.0" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="9" fill="#707A8A" letter-spacing="1">professional network</text>
<rect width="400" height="90" fill="#000" opacity="0.14"/>
<rect x="1" y="1" width="398" height="88" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.25;0.6;0.25" dur="3.4s" repeatCount="indefinite"/></rect>
