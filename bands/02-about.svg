    <text x="128" y="92" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="10" fill="#707A8A" letter-spacing="2.4">who I am</text>
    <line x1="40" y1="128" x2="1160" y2="128" stroke="#22D3EE" stroke-opacity="0.18"/>
<text x="40" y="176" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Engineering precision, driven by curiosity.</text>
    <line x1="40" y1="190" x2="290" y2="190" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.4"/>
<text x="40" y="226" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#A6AFC0">Aspiring Mechanical Engineer driven by innovation, precision, and continuous</text>
<text x="40" y="253" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#A6AFC0">improvement — applying technical knowledge and problem-solving ability in a</text>
<text x="40" y="280" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#A6AFC0">dynamic engineering environment.</text>
<text x="40" y="334" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#A6AFC0">Beyond core mechanical design, I bring a creative-technical edge — 3D modeling</text>
<text x="40" y="361" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#A6AFC0">and photorealistic rendering in Blender, hands-on hardware builds, and a growing</text>
<text x="40" y="388" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#A6AFC0">interest in AI, AR/VR and visual effects.</text>
